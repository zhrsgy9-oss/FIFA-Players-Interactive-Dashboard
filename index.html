<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Analytics Studio</title>
<style>
:root{--bg:#080F1D;--panel:#101A2D;--panel2:#14213A;--border:#2B3C59;--cyan:#36E0D0;--purple:#A18AFF;--text:#F3F7FF;--muted:#91A4BE}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body{overflow-x:hidden}
header{padding:18px 22px 14px;background:linear-gradient(120deg,#111D34,#080F1D);border-bottom:1px solid var(--border)}
.topline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
h1{margin:0;font-size:clamp(19px,2.2vw,27px);letter-spacing:.6px}h1 span{color:var(--cyan)}
.subtitle{margin-top:6px;color:var(--muted);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{border:1px solid #354968;border-radius:7px;padding:9px 12px;background:#15243D;color:var(--text);font-size:12px;cursor:pointer}
button:hover{border-color:var(--cyan);color:var(--cyan)}
.tabs{display:flex;gap:7px;padding:11px 16px;overflow-x:auto;background:#0B1323;border-bottom:1px solid var(--border);scrollbar-width:thin}
.tab{flex:0 0 auto;white-space:nowrap}.tab.active{background:var(--cyan);border-color:var(--cyan);color:#06131A;font-weight:700}
main{padding:12px}.page{display:none}.page.active{display:block}
.stage{position:relative;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 155px);overflow:auto;border:1px solid #1E2C46;border-radius:10px;background:radial-gradient(ellipse at top,#101B31 0%,#080F1D 75%);padding:8px}
.stage.radar-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.stage.radar-pair .chart-card{min-width:0;width:100%;height:calc(100vh - 245px);min-height:520px;margin:0}
.stage.stacked-charts .chart-card{min-width:0;width:100%;height:72vh;min-height:520px;margin:0}
.stage.stacked-charts .chart-card:last-child{margin-bottom:4px}
.chart-card{position:relative;display:flex;flex-direction:column;width:100%;height:calc(100vh - 185px);min-height:500px;min-width:650px;max-width:100%;margin-bottom:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 8px 24px #0004}
.card-head{height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 11px;background:var(--panel2);border-bottom:1px solid var(--border);cursor:grab;user-select:none;touch-action:none}
.card-head:active{cursor:grabbing}
.card-title{display:none}
.card-tools{display:flex;gap:6px;flex:0 0 auto}.card-tools button{padding:6px 9px;font-size:11px}
.frame-wrap{position:relative;flex:1 1 auto;min-height:0;background:var(--bg)}
.chart-frame{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.resize-handle{position:absolute;z-index:5;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 42%,var(--cyan) 43% 49%,transparent 50% 60%,var(--purple) 61% 67%,transparent 68%)}
.hint{padding:8px 3px 2px;color:var(--muted);font-size:11px;line-height:1.5}
.status{color:var(--muted);font-size:11px;margin-left:4px}
@media(max-width:900px){.stage.radar-pair{grid-template-columns:minmax(0,1fr)}.stage.radar-pair .chart-card{height:72vh}}
@media(max-width:720px){header{padding:14px}main{padding:6px}.stage{padding:4px}.chart-card{min-width:0}.tabs{padding:9px}}
</style>
</head>
<body>
<header><div class="topline"><div><h1><span>Football</span> Analytics Studio</h1><div class="subtitle">Player performance · Visual exploration</div></div><div class="actions"><button id="saveLayout">Save layout</button><button id="resetLayout">Reset current page</button></div></div></header>
<nav class="tabs" id="tabs" aria-label="Chart pages"></nav>
<main id="pages"></main>
<script>
(() => {
"use strict";
const STORAGE_KEY="football_analytics_layout_v7";
const pageDefs=[
 {id:"overview",tab:"Overview",charts:[
  {id:"map",title:"",file:"charts/football_map_luxury.html"},
  {id:"nationalities",title:"",file:"charts/top15nationalities.htm"}]},
 {id:"radar-gk",tab:"Player & GK View",layout:"radar-pair",charts:[
  {id:"radar-chart",title:"",file:"charts/radar.htm"},
  {id:"gk-chart",title:"",file:"charts/gk.htm"}]},
 {id:"gauge",tab:"Player Profile",charts:[
  {id:"profiles-chart",title:"",file:"charts/gggg.html"}]},
 {id:"scatter-pair",tab:"Player Comparisons",layout:"stacked-charts",charts:[
  {id:"scatter-chart",title:"",file:"charts/scat1.htm"},
  {id:"gk-scatter-chart",title:"",file:"charts/scat2.htm"}]},
 {id:"boxplot-attributes",tab:"Distributions & Attributes",layout:"stacked-charts",charts:[
  {id:"boxplot-chart",title:"",file:"charts/boxplot.htm"},
  {id:"attributes-chart",title:"",file:"charts/atrab.htm"}]},
 {id:"trends",tab:"Potential & Trends",layout:"stacked-charts",charts:[
  {id:"potential-chart",title:"",file:"charts/pot vs ova.htm"},
  {id:"mentality-chart",title:"",file:"charts/mentality vs attacking vs fk vs stamina.htm"}]}
];
const tabsEl=document.getElementById("tabs"),pagesEl=document.getElementById("pages");
let activePage="overview",layout=readLayout(),dragState=null,resizeState=null,saveTimer=null;
const refs=new Map();
function readLayout(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(_){return {}}}
function getSaved(chart){return layout[chart.id]||{}}
function persistLayout(){
 const page=refs.get(activePage);if(!page)return;
 page.cards.forEach(card=>{
  const c=card.el;
  layout[c.dataset.chartId]={width:c.style.width||"100%",height:c.style.height||"calc(100vh - 185px)",left:c.style.left||"0px",top:c.style.top||"0px",position:c.style.position||"relative"};
 });
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(layout));setStatus("Layout saved")}catch(_){setStatus("Browser could not save layout")}
}
function setStatus(msg){document.querySelectorAll(".status").forEach(el=>el.textContent=msg)}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persistLayout,350)}
function requestPlotlyResize(frame){
 try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.Plotly)return;d.querySelectorAll(".js-plotly-plot").forEach(p=>w.Plotly.Plots.resize(p))}catch(_){}
}
function createCard(pageDef,chart){
 const card=document.createElement("section");card.className="chart-card";card.dataset.chartId=chart.id;
 const saved=getSaved(chart);
 if(saved.width)card.style.width=saved.width;
 if(saved.height)card.style.height=saved.height;
 if(saved.left)card.style.left=saved.left;
 if(saved.top)card.style.top=saved.top;
 if(saved.position)card.style.position=saved.position;
 const head=document.createElement("div");head.className="card-head";
 const title=document.createElement("div");title.className="card-title";title.textContent="";title.setAttribute("aria-hidden","true");
 const tools=document.createElement("div");tools.className="card-tools";
 const open=document.createElement("button");open.type="button";open.textContent="Open chart";open.title="Open chart separately";open.addEventListener("click",()=>window.open(chart.file,"_blank"));
 const full=document.createElement("button");full.type="button";full.textContent="Fullscreen";full.addEventListener("click",async()=>{try{if(!document.fullscreenElement)await card.requestFullscreen();else await document.exitFullscreen()}catch(_){window.open(chart.file,"_blank")}});
 tools.append(open,full);head.append(title,tools);
 const wrap=document.createElement("div");wrap.className="frame-wrap";
 const frame=document.createElement("iframe");frame.className="chart-frame";frame.title="Chart";frame.src=chart.file;frame.loading="eager";
 frame.addEventListener("load",()=>{requestPlotlyResize(frame);setTimeout(()=>requestPlotlyResize(frame),300);setTimeout(()=>requestPlotlyResize(frame),900)});
 wrap.appendChild(frame);
 const handle=document.createElement("div");handle.className="resize-handle";handle.title="Drag to resize";
 card.append(head,wrap,handle);
 head.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")||e.button!==0)return;
  e.preventDefault();const cr=card.getBoundingClientRect(),sr=card.parentElement.getBoundingClientRect();
  dragState={card,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,left:cr.left-sr.left+card.parentElement.scrollLeft,top:cr.top-sr.top+card.parentElement.scrollTop,head};
  head.setPointerCapture(e.pointerId);
 });
 handle.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;e.preventDefault();e.stopPropagation();const r=card.getBoundingClientRect();
  resizeState={card,frame,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,width:r.width,height:r.height,handle};
  handle.setPointerCapture(e.pointerId);
 });
 return {el:card,frame};
}
function createPage(def,index){
 const tab=document.createElement("button");tab.className="tab"+(index===0?" active":"");tab.type="button";tab.textContent=def.tab;tab.addEventListener("click",()=>showPage(def.id));tabsEl.appendChild(tab);
 const page=document.createElement("section");page.className="page"+(index===0?" active":"");page.id="page-"+def.id;page.dataset.pageId=def.id;
 const stage=document.createElement("div");stage.className="stage"+(def.layout?" "+def.layout:"");
 const cardRefs=[];
 def.charts.forEach(ch=>{const c=createCard(def,ch);stage.appendChild(c.el);cardRefs.push(c)});
 const hint=document.createElement("div");hint.className="hint";
 hint.innerHTML='Use the controls on each panel to open it separately or view it full-screen. <span class="status"></span>';
 page.append(stage,hint);pagesEl.appendChild(page);refs.set(def.id,{page,tab,stage,cards:cardRefs});
}
function showPage(id){
 activePage=id;
 pageDefs.forEach(def=>{const r=refs.get(def.id);r.page.classList.toggle("active",def.id===id);r.tab.classList.toggle("active",def.id===id)});
 const r=refs.get(id);requestAnimationFrame(()=>r.cards.forEach(c=>requestPlotlyResize(c.frame)));
}
pageDefs.forEach(createPage);
document.addEventListener("pointermove",e=>{
 if(dragState&&e.pointerId===dragState.pointerId){
  const s=dragState,stage=s.card.parentElement;
  s.card.style.position="absolute";
  s.card.style.left=Math.max(0,s.left+e.clientX-s.startX)+"px";
  s.card.style.top=Math.max(0,s.top+e.clientY-s.startY)+"px";
  scheduleSave();
 }
 if(resizeState&&e.pointerId===resizeState.pointerId){
  const s=resizeState;
  s.card.style.width=Math.max(650,s.width+e.clientX-s.startX)+"px";
  s.card.style.height=Math.max(450,s.height+e.clientY-s.startY)+"px";
  s.card.style.maxWidth="none";
  requestAnimationFrame(()=>requestPlotlyResize(s.frame));scheduleSave();
 }
});
document.addEventListener("pointerup",e=>{
 if(dragState&&e.pointerId===dragState.pointerId){dragState=null;persistLayout()}
 if(resizeState&&e.pointerId===resizeState.pointerId){resizeState=null;persistLayout()}
});
document.getElementById("saveLayout").addEventListener("click",persistLayout);
document.getElementById("resetLayout").addEventListener("click",()=>{
 const r=refs.get(activePage);if(!r)return;
 r.cards.forEach(c=>{
  c.el.style.position="relative";c.el.style.left="";c.el.style.top="";
  c.el.style.width="100%";c.el.style.height="calc(100vh - 185px)";c.el.style.maxWidth="100%";
  delete layout[c.el.dataset.chartId];
  requestPlotlyResize(c.frame);
 });
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(layout))}catch(_){}
 setStatus("Current page reset");
});
window.addEventListener("resize",()=>{const r=refs.get(activePage);if(r)r.cards.forEach(c=>requestPlotlyResize(c.frame))});
window.addEventListener("load",()=>{const r=refs.get(activePage);if(r)r.cards.forEach(c=>requestPlotlyResize(c.frame))});
})();
</script>
</body>
</html>
